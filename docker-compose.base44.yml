services:
  web:
    image: node:22-slim
    working_dir: /workspace
    command: ["sh", "-ec", "npm install && exec npm run dev"]
    volumes:
      - ./:/workspace
    ports:
      - "3000:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=1
      - ELECTRON_SKIP_BINARY_DOWNLOAD=1
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:5173/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
